<style>
    /* ========================================================
       CORE VARIABLES & LAYOUT
    ======================================================== */
    :root {
        --cv-pad-x: clamp(0.25in, 4%, 0.8in);

    .app-header {
        background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); padding: 15px 25px;
        border-bottom: 1px solid rgba(56, 189, 248, 0.2); box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        position: relative; z-index: 10;
    }
    .header-container { display: flex; justify-content: space-between; align-items: center; max-width: 1600px; margin: 0 auto; flex-wrap: wrap; gap: 15px;}
    .app-title-group { display: flex; flex-direction: column; }

    .controls-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;}
    .select-style {
        padding: 10px 14px; background-color: #0f172a; color: #f8fafc;
        border: 1px solid #334155; border-radius: 8px; font-size: 9.5pt; font-weight: 600; cursor: pointer; outline: none;
    }
    
    /* Data Sync Buttons */
    .btn-sync {
        padding: 10px 16px; border: none; border-radius: 8px; font-weight: 700; font-size: 9.5pt; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; gap: 5px;
    }
    .btn-import { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid #3b82f6; }
    .btn-import:hover { background: #3b82f6; color: white; }
    .btn-export { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #f59e0b; }
    .btn-export:hover { background: #f59e0b; color: #fff; }
    
    .btn-print { padding: 10px 20px; background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; border: none; border-radius: 8px; font-weight: 700; font-size: 10pt; cursor: pointer; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2); transition: 0.3s; }
    .btn-print:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(16, 185, 129, 0.4); }
    
    /* Layout */
    .main-container { display: flex; width: 100%; height: calc(100vh - 85px); max-width: 100%; overflow: hidden; }
    .sidebar { width: 35%; min-width: 400px; background-color: #141b2e; padding: 25px; border-right: 1px solid #1e293b; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .preview-pane { width: 65%; background-color: #1e2538; padding: 30px; overflow-y: auto; display: block; text-align: center; }
    
    /* Dynamic Forms */
    .form-section { background: rgba(30, 41, 59, 0.7); padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); }
    .form-section h3 { margin-top: 0; margin-bottom: 15px; font-size: 11pt; color: #38bdf8; text-transform: uppercase; border-bottom: 1px solid rgba(56, 189, 248, 0.2); padding-bottom: 6px; }

    .editable-title:focus { border: 1px solid #38bdf8; box-shadow: 0 0 0 2px rgba(56,189,248,0.3); }

    .add-sec-btn { background: #3b82f6; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-size: 11pt; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; transition: 0.3s; }
    
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 9pt; font-weight: 600; margin-bottom: 6px; color: #94a3b8; }
    .form-group input, .form-group textarea { width: 100%; padding: 10px; background-color: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #f8fafc; font-size: 10pt; }

    /* ========================================================

    /* V40 UPDATE: MIN-HEIGHT ADDED TO PREVENT PDF CROPPING ON SHORT CVs */

    .cv-skill-item strong { color: #0f172a; font-weight: 700; }

<script>

    function processPhoto(event) {
        var file = event.target.files[0];
        if (file) {
            var reader = new FileReader();
            reader.onload = function(e) {
                uploadedPhotoData = e.target.value || e.target.result;
                var miniImg = document.getElementById('mini-photo-img');
                if (miniImg) miniImg.src = uploadedPhotoData;
                renderCV();
            };
            reader.readAsDataURL(file); 
        }
    }

    function updatePhotoPlacement() {
        var img = document.getElementById('cv-photo-img');
        var miniImg = document.getElementById('mini-photo-img');
        var zoom = document.getElementById('slider-zoom').value;
        var x = document.getElementById('slider-x').value;
        var y = document.getElementById('slider-y').value;
        var transformStr = "scale(" + (zoom/100) + ") translate(" + x + "px, " + y + "px)";
        if (img) img.style.transform = transformStr;
        if (miniImg) miniImg.style.transform = transformStr;
    }

    function applyTemplate() {
        var select = document.getElementById('style-select');
        document.getElementById('cv-paper').className = select.value;
        renderCV();
    }

    // HELPER FUNCTION: Prevents quotes in text from breaking the HTML structure during import
    function escapeHTML(str) {
        if(str === null || str === undefined) return "";
        str = String(str);
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // NEW HELPER FUNCTION: Dynamic File Naming based on applicant name + timestamp
    function getDynamicFileName(ext) {
        let rawName = document.getElementById('in-name').value || 'My';
        // Sanitize name (allow english, bengali, and numbers, replace others with underscore)
        let safeName = rawName.trim().replace(/[^a-zA-Z0-9\u0980-\u09FF]+/g, '_');
        
        if (ext === 'pdf') {
            return safeName + '_CV.pdf';
        } else {
            let d = new Date();
            let dateStr = d.getFullYear() + '-' + 
                          String(d.getMonth() + 1).padStart(2, '0') + '-' + 
                          String(d.getDate()).padStart(2, '0') + '_' + 
                          String(d.getHours()).padStart(2, '0') + '-' + 
                          String(d.getMinutes()).padStart(2, '0');
            return safeName + '_Data_' + dateStr + '.json';
        }
    }

                items.push({ h: item.querySelector('.in-j-h').value, d: item.querySelector('.in-j-d').value, b: item.querySelector('.in-j-b').value });
            });
            data.sections.experience = { title: document.getElementById('sec-title-exp').value, items: items };
        }
        if(document.getElementById('sec-wrapper-projects')) {
            data.sections.projects = { title: document.getElementById('sec-title-projects').value, content: document.getElementById('in-projects').value };
        }
        if(document.getElementById('sec-wrapper-edu')) {
            data.sections.edu = { title: document.getElementById('sec-title-edu').value, content: document.getElementById('in-edu').value };
        }
        if(document.getElementById('sec-wrapper-skills')) {
            let items = [];
            document.querySelectorAll('.skill-item').forEach(item => {
                items.push({ label: item.querySelector('.skill-label').value, val: item.querySelector('.skill-val').value });
            });
            data.sections.skills = { title: document.getElementById('sec-title-skills').value, items: items };
        }
        document.querySelectorAll('.custom-section-wrapper').forEach(item => {
            data.sections.custom.push({ title: item.querySelector('.custom-sec-title').value, content: item.querySelector('.custom-sec-content').value });
        });
        return JSON.stringify(data, null, 2);
    }

    function exportData(manualClick = false) {
        let jsonStr = buildExportJSON();
        let blob = new Blob([jsonStr], { type: "application/json" });
        let url = URL.createObjectURL(blob);
        let a = document.createElement('a');
        
        // V40 NEW DYNAMIC FILE NAME
        a.download = getDynamicFileName('json');
        a.href = url;
        a.click();
        URL.revokeObjectURL(url);
        
        if(manualClick) {
            alert("✅ আপনার ডাটা সফলভাবে (" + a.download + ") সেভ হয়েছে।\nপরবর্তীতে 'Import Data' বাটনে ক্লিক করে এই ফাইলটি দিলেই আবার আগের অবস্থায় ফিরে আসবে।");
        }
    }

    /* --- THE NEW, 100% BULLETPROOF IMPORT SYSTEM --- */
    function importData(event) {
        var file = event.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(e) {
            try {
                var data = JSON.parse(e.target.result);
                if (!data.sections) data.sections = {};
                
                if(data.profile) {
                    uploadedPhotoData = data.profile.photo || offlineImageSVG;
                    document.getElementById('mini-photo-img').src = uploadedPhotoData;
                    document.getElementById('slider-zoom').value = data.profile.zoom || 130;
                    document.getElementById('slider-x').value = data.profile.x || 0;
                    document.getElementById('slider-y').value = data.profile.y || -10;
                    document.getElementById('in-name').value = data.profile.name || "";
                    document.getElementById('in-title').value = data.profile.title || "";
                    document.getElementById('in-c1').value = data.profile.c1 || "";
                    document.getElementById('in-c2').value = data.profile.c2 || "";
                }
                
                if(data.template) { document.getElementById('style-select').value = data.template; }
                
                let dynHtml = ""; 
                
                if(data.sections.summary) {
                    dynHtml += `
                        <div class="form-section standard-sec" data-type="summary" id="sec-wrapper-summary">
                            <div class="section-header-row"><span class="section-label">Section Title</span><button class="remove-sec-btn" onclick="this.closest('.form-section').remove(); renderCV();">🗑️ Remove Section</button></div>
                            <input type="text" id="sec-title-summary" class="editable-title" value="${escapeHTML(data.sections.summary.title)}" oninput="renderCV()">
                            <div class="form-group"><textarea id="in-summary" oninput="renderCV()">${escapeHTML(data.sections.summary.content)}</textarea></div>
                        </div>`;
                }
                
                if(data.sections.experience) {
                    let itemsHtml = "";
                    if(data.sections.experience.items && Array.isArray(data.sections.experience.items)) {
                        data.sections.experience.items.forEach(item => {
                            itemsHtml += `
                                <div class="dynamic-group experience-item">
                                    <button class="remove-btn" onclick="this.parentElement.remove(); renderCV();">X</button>
                                    <div class="form-group"><label>Job Title & Company</label><input type="text" class="in-j-h" value="${escapeHTML(item.h)}" oninput="renderCV()"></div>
                                    <div class="form-group"><label>Date & Location</label><input type="text" class="in-j-d" value="${escapeHTML(item.d)}" oninput="renderCV()"></div>
                                    <div class="form-group"><label>Description</label><textarea class="in-j-b" oninput="renderCV()">${escapeHTML(item.b)}</textarea></div>
                                </div>`;
                        });
                    }
                    dynHtml += `
                        <div class="form-section standard-sec" data-type="experience" id="sec-wrapper-exp">
                            <div class="section-header-row"><span class="section-label">Section Title</span><button class="remove-sec-btn" onclick="this.closest('.form-section').remove(); renderCV();">🗑️ Remove Section</button></div>
                            <input type="text" id="sec-title-exp" class="editable-title" value="${escapeHTML(data.sections.experience.title)}" oninput="renderCV()">
                            <div id="experience-list">${itemsHtml}</div>
                            <button class="add-btn" onclick="addExperienceGroup()">➕ Add More Experience</button>
                        </div>`;
                }

                if(data.sections.projects) {
                    dynHtml += `
                        <div class="form-section standard-sec" data-type="projects" id="sec-wrapper-projects">
                            <div class="section-header-row"><span class="section-label">Section Title</span><button class="remove-sec-btn" onclick="this.closest('.form-section').remove(); renderCV();">🗑️ Remove Section</button></div>
                            <input type="text" id="sec-title-projects" class="editable-title" value="${escapeHTML(data.sections.projects.title)}" oninput="renderCV()">
                            <div class="form-group"><label>Add new lines to create bullet points</label><textarea id="in-projects" oninput="renderCV()">${escapeHTML(data.sections.projects.content)}</textarea></div>
                        </div>`;
                }

                if(data.sections.edu) {
                    dynHtml += `
                        <div class="form-section standard-sec" data-type="edu" id="sec-wrapper-edu">
                            <div class="section-header-row"><span class="section-label">Section Title</span><button class="remove-sec-btn" onclick="this.closest('.form-section').remove(); renderCV();">🗑️ Remove Section</button></div>
                            <input type="text" id="sec-title-edu" class="editable-title" value="${escapeHTML(data.sections.edu.title)}" oninput="renderCV()">
                            <div class="form-group"><label>Add new lines to create bullet points</label><textarea id="in-edu" oninput="renderCV()">${escapeHTML(data.sections.edu.content)}</textarea></div>
                        </div>`;
                }

                if(data.sections.skills) {
                    let skillsHtml = "";
                    if(data.sections.skills.items && Array.isArray(data.sections.skills.items)) {
                        data.sections.skills.items.forEach(item => {
                            skillsHtml += `
                                <div class="dynamic-group skill-item" style="padding: 12px;">
                                    <button class="remove-btn" style="top: 8px; right: 8px; padding: 2px 6px;" onclick="this.parentElement.remove(); renderCV();">X</button>
                                    <div style="display: flex; gap: 10px; margin-right: 25px;">
                                        <input type="text" class="skill-label" value="${escapeHTML(item.label)}" oninput="renderCV()" style="width: 35%; padding: 8px; background: #0f172a; border: 1px solid #334155; color: #38bdf8; font-weight:bold; border-radius: 4px;">
                                        <input type="text" class="skill-val" value="${escapeHTML(item.val)}" oninput="renderCV()" style="width: 65%; padding: 8px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 4px;">
                                    </div>
                                </div>`;
                        });
                    }
                    dynHtml += `
                        <div class="form-section standard-sec" data-type="skills" id="sec-wrapper-skills">
                            <div class="section-header-row"><span class="section-label">Section Title</span><button class="remove-sec-btn" onclick="this.closest('.form-section').remove(); renderCV();">🗑️ Remove Section</button></div>
                            <input type="text" id="sec-title-skills" class="editable-title" value="${escapeHTML(data.sections.skills.title)}" oninput="renderCV()">
                            <div id="skills-list">${skillsHtml}</div>
                            <button class="add-btn" onclick="addSkillGroup()">➕ Add More Skills</button>
                        </div>`;
                }
                
                document.getElementById('dynamic-sections-container').innerHTML = dynHtml;

                let customHtml = "";
                if(data.sections.custom && Array.isArray(data.sections.custom)) {
                    data.sections.custom.forEach(item => {
                        customHtml += `
                            <div class="form-section custom-section-wrapper">
                                <div class="section-header-row">
                                    <span class="section-label">Custom Section</span>
                                    <button class="remove-sec-btn" onclick="this.closest('.form-section').remove(); renderCV();">🗑️ Remove Section</button>
                                </div>
                                <input type="text" class="editable-title custom-sec-title" value="${escapeHTML(item.title)}" oninput="renderCV()">
                                <div class="form-group">
                                    <label>Content (Add new lines for bullets or paragraphs)</label>
                                    <textarea class="custom-sec-content" oninput="renderCV()">${escapeHTML(item.content)}</textarea>
                                </div>
                            </div>`;
                    });
                }
                document.getElementById('custom-sections-container').innerHTML = customHtml;

                renderCV();
                alert("✅ আপনার ডাটা সফলভাবে রিস্টোর হয়েছে!");
            } catch (err) {
                console.error("JSON Import Error Details:", err);
                alert("❌ ফাইলটি পড়তে সমস্যা হচ্ছে। দয়া করে সঠিক CV_Data.json ফাইলটি সিলেক্ট করুন।\nError: " + err.message);
            }
        };
        reader.readAsText(file);
        event.target.value = ""; 
    }

    function adjustMobilePreview() {
        var wrapper = document.getElementById('cv-scale-wrapper');
        var paper = document.getElementById('cv-paper');
        if (window.innerWidth <= 900) {
            var scale = (window.innerWidth - 30) / 850;
            wrapper.style.transform = 'scale(' + scale + ')';
            var scaledHeight = paper.offsetHeight * scale;
            wrapper.style.height = scaledHeight + 'px';
        } else {
            wrapper.style.transform = 'none';
            wrapper.style.height = 'auto';
        }
    }
    window.addEventListener('resize', adjustMobilePreview);

    function switchMobileTab(tab) {
        var formBtn = document.getElementById('btn-nav-form');
        var previewBtn = document.getElementById('btn-nav-preview');
        var sidebar = document.getElementById('app-sidebar');
        var previewPane = document.getElementById('app-preview-pane');

        if (tab === 'form') {
            formBtn.classList.add('active'); previewBtn.classList.remove('active');
            sidebar.style.display = 'block'; previewPane.style.display = 'none';
        } else {
            previewBtn.classList.add('active'); formBtn.classList.remove('active');
            sidebar.style.display = 'none'; previewPane.style.display = 'flex';
            setTimeout(adjustMobilePreview, 50);
        }
    }

    function downloadDirectPDF() {
        exportData(false);
        setTimeout(function(){
            alert("আপনার বর্তমান সিভির ডাটা অটোমেটিক ডাউনলোড করা হয়েছে।\n\nপরে যদি আবার এই সিভি এডিট করতে চান, তাহলে একদম উপরে থাকা 'Import Data' বাটনে ক্লিক করে ডাউনলোড হওয়া ডাটা ফাইলটি সিলেক্ট করলেই সব তথ্য আবার চলে আসবে!");
        }, 200);

        var element = document.getElementById('cv-paper');
        var desktopBtn = document.querySelector('.btn-print.desktop-only');
        var mobileBtn = document.querySelector('.nav-btn.download-btn');
        var originalDesktopText = desktopBtn ? desktopBtn.innerText : '';
        var originalMobileHTML = mobileBtn ? mobileBtn.innerHTML : '';
        
        if(desktopBtn) desktopBtn.innerText = "⏳ Generating...";
        if(mobileBtn) mobileBtn.innerHTML = "<span style='font-size: 16pt;'>⏳</span> Wait...";

        let dynamicPdfName = getDynamicFileName('pdf');

        if (window.innerWidth <= 900) {
            document.body.classList.add('pdf-export-mode');
            setTimeout(function() {
                var w = 850; var h = Math.ceil(element.getBoundingClientRect().height) + 2; 
                var opt = { margin: 0, filename: dynamicPdfName, image: { type: 'jpeg', quality: 1 }, html2canvas: { scale: 2, useCORS: true, logging: false, windowWidth: 850, scrollY: 0 }, jsPDF: { unit: 'px', format: [w, h], orientation: 'portrait' } };
                html2pdf().set(opt).from(element).save().then(function() {
                    document.body.classList.remove('pdf-export-mode');
                    if(desktopBtn) desktopBtn.innerText = originalDesktopText;
                    if(mobileBtn) mobileBtn.innerHTML = originalMobileHTML;
                    adjustMobilePreview();
                });
            }, 500);
        } else {
            var originalShadow = element.style.boxShadow;
            element.style.boxShadow = 'none';
            setTimeout(function() {
                var w = element.offsetWidth; var h = Math.ceil(element.getBoundingClientRect().height) + 2; 
                var opt = { margin: 0, filename: dynamicPdfName, image: { type: 'jpeg', quality: 1 }, html2canvas: { scale: 2, useCORS: true, logging: false }, jsPDF: { unit: 'px', format: [w, h], orientation: 'portrait' } };
                html2pdf().set(opt).from(element).save().then(function() {
                    element.style.boxShadow = originalShadow;
                    if(desktopBtn) desktopBtn.innerText = originalDesktopText;
                    if(mobileBtn) mobileBtn.innerHTML = originalMobileHTML;
                });
            }, 100);
        }
    }

    function safeGetValue(id) { 
        var el = document.getElementById(id); 
        return el ? el.value : ""; 
    }

    function renderCV() {
        var name = document.getElementById('in-name').value;
        var title = document.getElementById('in-title').value;
        var c1 = document.getElementById('in-c1').value;
        var c2 = document.getElementById('in-c2').value;
        
        function makeBullets(text) {
            if(!text) return ""; 
            var html = "";
            text.split('\n').forEach(function(line) {
                if (line.trim()) {
                    if (line.trim().startsWith('•') || line.trim().startsWith('-')) { line = line.substring(1).trim(); }
                    html += "<li>" + line.trim() + "</li>";
                }
            });
            return html;
        }

        let htmlSummary = "", htmlSummaryEditorial = "", htmlSummarySidebar = "";
        if(document.getElementById('sec-wrapper-summary')) {
            let t = safeGetValue('sec-title-summary'); let c = safeGetValue('in-summary');
            let base = `<div class="cv-sec"><div class="cv-sec-title">${t}</div><p class="cv-summary-text">${c}</p></div>`;
            htmlSummary = base; htmlSummarySidebar = base;
            htmlSummaryEditorial = `<div class="cv-sec"><div class="cv-sec-title">${t}</div><div class="cv-summary-text"><div>${c.substring(0, c.length/2)}</div><div>${c.substring(c.length/2)}</div></div></div>`;
        }

        let htmlExp = "", htmlExpSidebar = "";
        if(document.getElementById('sec-wrapper-exp')) {
            let t = safeGetValue('sec-title-exp');
            let itemsStd = "", itemsSide = "";
            document.querySelectorAll('.experience-item').forEach(item => {
                let h = item.querySelector('.in-j-h').value; let d = item.querySelector('.in-j-d').value; let b = item.querySelector('.in-j-b').value;
                itemsStd += `<div class="cv-entry"><div class="cv-entry-header"><div class="cv-entry-left">${h}</div><div class="cv-entry-right">${d}</div></div><ul class="cv-entry-bullets">${makeBullets(b)}</ul></div>`;
                itemsSide += `<div class="cv-entry" style="margin-top:8px;"><strong>${h}</strong> <span style="font-size:10pt; float:right;">${d}</span><ul class="cv-entry-bullets">${makeBullets(b)}</ul></div>`;
            });
            htmlExp = `<div class="cv-sec"><div class="cv-sec-title">${t}</div>${itemsStd}</div>`;
            htmlExpSidebar = `<div class="cv-sec"><div class="cv-sec-title">${t}</div>${itemsSide}</div>`;
        }

        let htmlProj = "";
        if(document.getElementById('sec-wrapper-projects')) {
            let t = safeGetValue('sec-title-projects'); let c = safeGetValue('in-projects');
            htmlProj = `<div class="cv-sec"><div class="cv-sec-title">${t}</div><ul class="cv-entry-bullets" style="padding-left:16px;">${makeBullets(c)}</ul></div>`;
        }

        let htmlEdu = "";
        if(document.getElementById('sec-wrapper-edu')) {
            let t = safeGetValue('sec-title-edu'); let c = safeGetValue('in-edu');
            htmlEdu = `<div class="cv-sec"><div class="cv-sec-title">${t}</div><ul class="cv-entry-bullets" style="list-style-type:none; padding-left:0;">${makeBullets(c)}</ul></div>`;
        }

        let htmlSkills = "", htmlSkillsSidebar = "";
        if(document.getElementById('sec-wrapper-skills')) {
            let t = safeGetValue('sec-title-skills');
            let col1 = "", col2 = "", side = "";
            document.querySelectorAll('.skill-item').forEach((item, index) => {
                let label = item.querySelector('.skill-label').value; let val = item.querySelector('.skill-val').value;
                let htmlStr = `<div class="cv-skill-item"><strong>${label}:</strong> ${val}</div>`;
                if (index % 2 === 0) col1 += htmlStr; else col2 += htmlStr;
                side += `<div class="cv-skill-item" style="margin-top:10px;"><strong>${label}:</strong> ${val}</div>`;
            });
            htmlSkills = `<div class="cv-sec"><div class="cv-sec-title">${t}</div><div class="cv-skills-layout"><div class="cv-skills-col">${col1}</div><div class="cv-skills-col">${col2}</div></div></div>`;
            htmlSkillsSidebar = `<div class="cv-sec" style="margin-top:20px;"><div class="cv-sec-title">${t}</div>${side}</div>`;
        }

        let htmlCustom = "";
        document.querySelectorAll('.custom-section-wrapper').forEach(item => {
            let t = item.querySelector('.custom-sec-title').value;
            let c = item.querySelector('.custom-sec-content').value;
            htmlCustom += `<div class="cv-sec"><div class="cv-sec-title">${t}</div><ul class="cv-entry-bullets" style="padding-left:16px;">${makeBullets(c)}</ul></div>`;
        });

        var currentTpl = document.getElementById('style-select').value;
        var headerHTML = `
            <div class="cv-header">
                <div class="cv-photo-frame"><img id="cv-photo-img" src="${uploadedPhotoData}" alt="Profile"></div>
                <div class="cv-name-title"><h1 class="cv-name">${name}</h1><div class="cv-title">${title}</div><div class="cv-contact-row">${c1}<br>${c2}</div></div>
            </div>
        `;

        var target = document.getElementById('cv-dynamic-content');
        
        if (currentTpl === 'tpl-modern-sidebar') {
            target.innerHTML = `
                <div class="tpl-twocol-wrapper">
                    <div class="tpl-twocol-side">${headerHTML}${htmlSkillsSidebar}</div>
                    <div class="tpl-twocol-main">${htmlSummarySidebar}${htmlExpSidebar}${htmlProj}${htmlEdu}${htmlCustom}</div>
                </div>
            `;
        } else if (currentTpl === 'tpl-editorial') {
            target.innerHTML = headerHTML + htmlSummaryEditorial + htmlExp + htmlProj + htmlEdu + htmlSkills + htmlCustom;
        } else {
            target.innerHTML = headerHTML + htmlSummary + htmlExp + htmlProj + htmlEdu + htmlSkills + htmlCustom;
        }
        
        updatePhotoPlacement();
        var previewPane = document.getElementById('app-preview-pane');
        if (window.innerWidth <= 900 && window.getComputedStyle(previewPane).display !== 'none') {
            setTimeout(adjustMobilePreview, 50);
        }
    }

    renderCV();
</script>
